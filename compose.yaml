services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${APP_PORT:-8080}:8000"

    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Hello from Docker Compose! ᓚ₍ ^. .^₎}"
      STORAGE: "redis"
      REDIS_URL: "redis://redis:6379/0"

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --dir
      - /data

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redis_data: